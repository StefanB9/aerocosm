cargo-features = ["panic-immediate-abort"]

[workspace]
members = [
    "crates/aerocosm",
    "crates/aerocosm-basemap",
    "crates/aerocosm-core",
    "crates/aerocosm-data",
    "crates/aerocosm-viewer",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
bevy = { version = "0.20.1", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_log",
    "bevy_mesh",
    "bevy_picking",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "std",
    "ui_picking",
] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
csv = { version = "1.4.0", default-features = false }
jiff = { version = "0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
lyon_tessellation = { version = "1.0.23", default-features = false, features = ["std"] }
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["float_roundtrip", "std"] }
thiserror = { version = "2.0.21", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

# --- Dev dependencies ---
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0" }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "immediate-abort"
rpath = false
strip = true

# Release settings for benchmarks: `cargo bench --profile bench-unwind`.
# Bench targets need unwinding; with build-std, release's immediate-abort
# builds `core` twice with conflicting panic strategies (E0152).
[profile.bench-unwind]
inherits = "release"
panic = "unwind"

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = true
strip = false

# The core's tests simulate the whole world (plan M5): unoptimised, one test
# takes minutes. Optimising the core and the decoder of its assets keeps
# them to seconds; everything else stays fast to build.
[profile.dev.package.aerocosm-core]
opt-level = 2

[profile.dev.package.ruzstd]
opt-level = 2
